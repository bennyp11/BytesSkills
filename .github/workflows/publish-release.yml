name: Deploy published release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: bytes-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag belongs to MVP and matches release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e 'const v=require("../release.json").version;if(!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(v)||process.env.RELEASE_TAG!=="v"+v)throw Error("Invalid release tag")'
          git merge-base --is-ancestor HEAD origin/mvp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - name: Check credentials before cloud mutations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BYTES_RELEASE_KEY: ${{ secrets.BYTES_RELEASE_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing production CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$BYTES_RELEASE_KEY" || { echo 'Missing production BYTES_RELEASE_KEY'; exit 1; }
      - name: Download prepared assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$RELEASE_TAG" --dir ../release-dist
      - name: Verify bytes, migrations and deployed version before changes
        run: node scripts/ship-release.mjs preflight ../release-dist
        env:
          BYTES_RELEASE_KEY: ${{ secrets.BYTES_RELEASE_KEY }}
      - name: Apply reviewed additive migrations
        run: node scripts/deploy-migrations.mjs
        env:
          BYTES_POSTGRES_ADMIN_URL: ${{ secrets.BYTES_POSTGRES_ADMIN_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the prepared Worker without rebuilding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RELEASE_VERSION=$(node -p 'require("../release.json").version')
          RELEASE_COMMIT=$(git rev-parse HEAD)
          npx wrangler deploy ../release-dist/worker.js --no-bundle --config wrangler.jsonc --var "RELEASE_VERSION:$RELEASE_VERSION" --var "RELEASE_COMMIT:$RELEASE_COMMIT"
      - name: Verify Worker and publish immutable skills
        run: node scripts/ship-release.mjs publish ../release-dist
        env:
          BYTES_RELEASE_KEY: ${{ secrets.BYTES_RELEASE_KEY }}
      - name: Report incomplete deployment
        if: failure()
        run: |
          echo '## Release incomplete' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect the failed step. The Worker or a subset of skills may already be live. No automatic rollback or workspace adoption was performed. Retry this run with the same tag after correcting the cause.' >> "$GITHUB_STEP_SUMMARY"
