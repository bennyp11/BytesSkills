# BytesSkills catalog convention; hosts do not automatically read this file.
schema_version: 1
name: BytesSkills
categories:
  - content-strategy
  - writing-storytelling
  - video-editing
  - visual-design
  - publishing-distribution
  - performance-learning
plugins:
  - id: bytesskills-core
    path: plugins/bytesskills-core
    status: assistant-help-and-sync
    skills:
      - id: bytes-help
        status: authored
        inputs: [help-request]
        outputs: [command-guidance]
      - id: bytes-sync
        status: authored
        inputs: [repository-path, sync-request]
        outputs: [sync-report]
  - id: video-editing
    path: plugins/video-editing
    status: scaffold
    skills:
      - id: pacing
        stage: post-production
        tags: [timing, editing]
        inputs: [video, transcript, edit-plan]
        outputs: [cut-list, edited-video]
        status: scaffold
      - id: captions
        stage: post-production
        tags: [text, accessibility]
        inputs: [video, timed-transcript]
        outputs: [caption-plan, edited-video]
        status: scaffold
definitions:
  formats:
    - id: reductions
      path: definitions/formats/reductions.json
      status: draft
  treatments:
    - id: restrained-narrator
      path: definitions/treatments/restrained-narrator.json
      status: draft
  workflows:
    - id: reduction-production
      path: definitions/workflows/reduction-production.json
      status: design-only
  sound_libraries:
    - id: reductions-light
      path: definitions/sound-libraries/reductions-light.json
      status: proposed-palette-no-audio
