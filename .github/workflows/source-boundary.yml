name: Source boundary
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-source-boundary.py
  library:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: python3 -m unittest discover -s ../tests -q

  postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: service
    env:
      BYTES_POSTGRES_TEST_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: node --test test/postgres.test.mjs

  email-results:
    needs: [check, library, postgres]
    if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      # No checkout, artifacts or PR code execute in this credential-bearing job.
      - name: Send CI result through Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EMAIL_TO: ${{ vars.CI_NOTIFICATION_EMAIL }}
          EMAIL_FROM: ${{ vars.CI_NOTIFICATION_FROM }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const {CF_TOKEN,CF_ACCOUNT,EMAIL_TO,EMAIL_FROM,RUN_ID,RUN_ATTEMPT,RESULTS}=process.env;
          if(!CF_TOKEN||!CF_ACCOUNT||!EMAIL_TO||!EMAIL_FROM)throw Error('CI email configuration is missing');
          const jobs=JSON.parse(RESULTS);
          const summary=Object.entries(jobs).map(([name,job])=>`${name}: ${job.result}`).join('\n');
          const ok=Object.values(jobs).every(job=>job.result==='success');
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/email/sending/send`,{
            method:'POST',headers:{Authorization:`Bearer ${CF_TOKEN}`,'Content-Type':'application/json'},
            body:JSON.stringify({from:EMAIL_FROM,to:EMAIL_TO,subject:`BytesSkills CI: ${ok?'passed':'needs attention'}`,
              text:`Test run ${RUN_ID}, attempt ${RUN_ATTEMPT}\n\n${summary}\n\nhttps://github.com/bennyp11/BytesSkills/actions/runs/${RUN_ID}\n\nThis is a test report, not a login link.`})});
          const result=await r.json();
          if(!r.ok||!result.success)throw Error(`Cloudflare email delivery request failed (${r.status})`);
          console.log('CI email accepted by Cloudflare');
          JS
